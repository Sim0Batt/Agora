services:
  - type: web
    runtime: static
    name: agora-web
    rootDir: web-app
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    routes:
      # Fallback SPA: react-router gestisce le route lato client
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        sync: false
